[package]
name = "pipeline"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "The learning loop: self-play datagen, trainer, gate."

[dependencies]
board = { path = "../board" }
nnue = { path = "../nnue" }
# The loop gates candidates. PROGRAM candidates are one of FITNESS 1's classes, so the loop
# needs to run them -- no cycle: interp depends on grammar/nnue/board and not on pipeline.
grammar = { path = "../grammar" }
interp = { path = "../interp" }

[[bin]]
name = "learn"
path = "src/main.rs"
