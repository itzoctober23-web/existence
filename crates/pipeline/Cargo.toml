[package]
name = "pipeline"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "The learning loop: self-play datagen, trainer, gate."

[dependencies]
board = { path = "../board" }
nnue = { path = "../nnue" }
# The loop gates candidates. PROGRAM candidates are one of FITNESS 1's classes, so the loop
# needs to run them -- no cycle: interp depends on grammar/nnue/board and not on pipeline.
grammar = { path = "../grammar" }
interp = { path = "../interp" }

[[bin]]
name = "learn"
path = "src/main.rs"

# EXAMPLES DO NOT RUN THEIR TESTS unless told to. `evolve selftest` was a subcommand, so the controls
# for `select_survivors` -- including that dslots=0 is byte-identical to truncate(mu) -- gated nothing
# until a human typed the command. `test = true` puts them under `cargo test`.
[[example]]
name = "evolve"
path = "examples/evolve.rs"
test = true
