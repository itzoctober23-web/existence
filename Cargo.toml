[workspace]
resolver = "3"
members = ["crates/board"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
authors = ["ExistenceIsPain"]

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"

# Perft and the interpreter benchmark are meaningless on a debug build.
[profile.dev]
opt-level = 1
