# DECLARED PARAMETERS for the P2 search track. Given column, not learned.
#
# These are experimenter choices with a measured justification, kept in a file rather than as
# constants so that changing one is a visible, reviewable act. `evolve` REFUSES TO RUN if this
# file is missing or a key does not parse -- a declared parameter that silently falls back to a
# default is not declared.
#
# Format: one `key = value` per line. `#` starts a comment.

# POPULATION SIZE (mu) for the (mu + lambda) loop.
#
# 8, raised from the 4 first implemented. The population exists to carry intermediates that are
# WORSE than the best, because the one rung ever measured as fitter than the seed sits behind a
# conjunctive valley (ladder_valley_RESULT.md: probe-only 0.991x, store-only 0.997x, both 1.024x).
# With mu = 4 the elite plus a few near-neutral variants fill every slot and a downhill
# intermediate is evicted; 8 leaves room for it to survive long enough to be built on.
mu = 8

# PLATEAU TOLERANCE (eps). A candidate enters the population if its rate is within this fraction
# of the best.
#
# 0.02, from the measurement rather than from taste: the DEEPEST valley half is 0.9% below the
# seed (probe-only, 0.991x), so the window must exceed 0.009 to admit it. 0.02 clears that with
# roughly 2x margin while still rejecting anything meaningfully worse.
#
# THE MATE GUARD IS NOT PART OF THIS AND IS NEVER RELAXED. `f >= best_found` stays strict; eps
# applies to COST ONLY. Both exploits this track has produced -- searching one ply shallower, and
# raising the initial alpha to +8 -- trade correctness for cost and are caught by the
# mate/disagreement/window sets scoring ZERO rather than "fewer", so a wider cost window does not
# weaken them.
#
# ESCALATION IS BOUNDED AND PRE-DECLARED: if the population cannot hold a probe-only or store-only
# intermediate for >= 5 consecutive generations at 0.02, raise ONCE to 0.05 and record the change
# here with the date. If it still cannot, STOP and write it up as a result about the prior. Do not
# raise a third time -- an eps large enough to admit anything is not a tolerance, it is the absence
# of a filter.
eps = 0.02

# OFFSPRING PER GENERATION (lambda). Kept at 12: measured at ~90 s per generation with parallel
# fitness across 3 cores, which is the affordable cadence for a 4-ply fitness (a "depth 3" search
# is 4 plies here, ~144k evals per position).
lambda = 12

# PER-LINEAGE SEARCH BUDGET, passed as `run(prog, pos, budget)`.
#
# MEASURED NECESSITY, not a preference. `fitness()` used to pass 16 to everything. Alpha-beta
# IGNORES that value -- it recurses on the depth table -- while UCT spends playouts against it, so
# one global budget is silently tuned for the lineage that does not read it. At budget 16 the UCT
# seed scores 1/25 on the fitness set for 1.6% of alpha-beta's cost, and reports 2.525x its
# mates-per-cost: the FITTEST program on the board, by being cheap and wrong.
#
# Swept (`evolve mctsbudget`), 25 positions at depth 3, against alpha-beta's 25/25 for 9.93e9:
#     budget    16 ->  1 mate   0.016x cost
#     budget    64 ->  6 mates  0.085x
#     budget   256 -> 12 mates  0.858x   <- matched cost, and the value used below
#     budget  1024 -> 10 mates  3.059x
#     budget 16384 ->  0 mates  5.035x   (every position hits the 2e9 per-run cost cap)
#
# 256 is chosen because it is the point where the two lineages spend COMPARABLE cost, which is the
# only basis on which their programs can be compared at all. It gives the MCTS lineage a mate guard
# of f >= 12 rather than the vacuous f >= 1 that budget 16 implies.
#
# UNEXPLAINED AND RECORDED: mates FALL from 12 to 10 as the budget rises 256 -> 1024 -> 4096. More
# playouts making UCT worse is not what UCT should do. It does not block the lineage at 256, but it
# is a defect in the seed or in the interpreter's UCT that should be understood before any hybrid
# claim rests on this program.
budget_main = 16
budget_mcts = 512

# RE-DERIVED 2026-09-08 after the UCT exploration term was fixed (scale moved INSIDE the Div).
# The fix changed the search's behaviour enough to MOVE the cost-parity point, so the value that
# justified 256 no longer held. Re-swept rather than interpolated:
#     budget  256 -> 10 mates  0.413x AB cost
#     budget  512 -> 11 mates  0.968x AB cost   <- parity, and the value now used
#     budget 1024 -> 13 mates  2.173x AB cost   <- best score, but at 2.2x the cost
#     budget 2048 -> 12 mates  3.391x
#     budget 4096 -> 11 mates  4.122x
#
# AND THE FIX DID NOT IMPROVE MCTS AT MATCHED COST. Before it, parity sat at budget 256 with 12/25;
# after it, parity is budget 512 with 11/25. The peak rose (12 -> 13) and moved to a higher budget,
# which is what a working exploration term should do, but mates-per-COST did not improve. Recorded
# because the tempting summary -- "fixed the exploration term, MCTS got better" -- is false.

# GUARD TOLERANCE: how many of the 25 guard positions a candidate may lose and still be accepted.
#
# MEASURED, both numbers from the SAME (alpha-sensitive) guard, 100 single-edit mutants:
#     genuine behaviour-changing candidates   lost 3:2  4:4  5:6  7:10  8:1  22:2  25:8
#     ALPHA exploit (neg(INF) -> 8)           loses 5
#     DEPTH exploit (d==0 -> d==1)            loses 8
#
#     tolerance 2 -> admits  0/33 genuine, exploits NONE
#     tolerance 3 -> admits  2/33 genuine, exploits NONE
#     tolerance 4 -> admits  6/33 genuine, exploits NONE   <- widest safe value, used here
#     tolerance 5 -> admits 12/33 genuine, exploits ALPHA
#
# WHY IT IS NEEDED: at tolerance 0 the guard admits ZERO behaviour-changing candidates. Everything
# that changes play fails it and everything that passes plays identically, so the loop rejects
# every candidate that could be an improvement, using a rule that cannot tell "worse" from
# "different".
#
# THE MARGIN IS ONE, and that is the risk. Genuine candidates are admitted at 4, the nearest known
# exploit sits at 5, and the separation rests on a sample of exactly TWO adversaries -- both of
# which this project discovered by surprise. A third exploit losing 4 walks straight through. If a
# new exploit appears, re-measure this table before adjusting anything else.
#
# THIS ONLY WORKS ON THE ALPHA-SENSITIVE GUARD. On the older window-sensitive guard the ALPHA
# exploit lost 2 -- exactly the genuine minimum -- and NO tolerance separated the classes. The
# guard and the tolerance are a matched pair; changing one without re-measuring the other is how
# this becomes an exploit generator.
guard_tolerance = 4

